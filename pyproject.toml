[project]
name = "masters-thesis"
version = "0.1.0"
description = "Master's thesis on trading strategies using reinforcement learning with TorchRL"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Krzysztof Wojdalski"},
]
keywords = ["reinforcement-learning", "trading", "torchrl", "deep-learning", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]


dependencies = [
    # Core scientific computing
    "pandas>=2.2.1",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "databento>=0.52.0",
    "python-dotenv>=1.0.0",
    # Deep learning and RL
    "torch>=2.8.0",
    "torchrl>=0.7.0",
    "tensordict>=0.5.0",
    "gymnasium>=0.29.1",
    # Trading environment
    "gym-trading-env>=0.0.0",
    # Visualization
    "plotnine>=0.13.0",
    "jinja2>=3.1.0",
    # Experiment tracking and CLI
    "mlflow>=2.9.0",
    "typer>=0.12.3",
    "rich>=13.7.0",
    # Development tools
    "black>=24.3.0",
    "ruff>=0.5.0",
    "gym-anytrading>=2.0.0",
    "tradingenv>=0.1.3",
    "captum>=0.8.0",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.0",
    "gdown>=5.2.1",
    "papermill>=2.7.0",
    "loguru>=0.7.3",
    "markdown>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-markdown-docs>=0.5.0",
    "pytest-codeblocks>=0.17.0",
    "mktestdocs>=0.2.5",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

analysis = [
    "ta>=0.11.0",  # Technical analysis library
    "yfinance>=0.2.0",  # Yahoo Finance data
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

#all = [
#    "masters-thesis[dev,analysis,docs]",
#]

[project.scripts]
train-agent = "scripts.train_trading_agent:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "untitled.*",
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "notebooks/"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # bandit security checks
    "B",    # bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (timezone awareness)
    "T20",  # flake8-print (no print statements)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert statements (needed for tests)
    "B018",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T20"]  # Allow asserts and prints in tests
"scripts/*" = ["T20"]  # Allow prints in scripts

[tool.ruff.lint.isort]
known-first-party = ["src", "cli", "common"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "poethepoet>=0.48.0",
]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.uv]
# gym-trading-env 0.3.5 hard-pins flask==2.2.5, but that version has a known
# LOW-severity security issue (missing Vary: Cookie header). Override to allow
# a patched version. gym-trading-env's web dashboard may not work correctly
# with Flask 3.x, but that feature is not used in this project.
override-dependencies = [
    "flask>=3.1.3",
    # mlflow<=3.15.1 caps cryptography below the version fixing
    # CVE-2026-69247/69248/69249 and the bundled-OpenSSL advisory
    # (GHSA for alert #140). Force past mlflow's stated ceiling.
    "cryptography>=50.0.0",
]

[tool.poe.tasks]
test = "uv run pytest"
lint = "uv run ruff check ."

[tool.poe.tasks.fonts]
cmd = "uv run python scripts/install_thesis_fonts.py"
help = "Install and rename Latin Modern Roman fonts so matplotlib/plotnine can find them"

[tool.poe.tasks.quarto-install]
shell = "brew install --cask quarto && quarto install tinytex --no-prompt"
help = "Install the Quarto CLI and TinyTeX (interactive: needs your sudo password)"

[tool.poe.tasks.setup]
sequence = ["quarto-install", "fonts"]
help = "Bootstrap everything uv sync does not cover: Quarto, TinyTeX, thesis fonts"

[tool.poe.tasks.thesis-pdf]
cmd = "uv run quarto render thesis/qmd/src/masters-thesis.qmd --to pdf"
help = "Render the thesis to PDF (pulls in latest experiment results via pre-render hook)"

[tool.poe.tasks.thesis-html]
cmd = "uv run quarto render thesis/qmd/src/masters-thesis.qmd --to html"
help = "Render the thesis to HTML"

[tool.poe.tasks.thesis-docx]
cmd = "uv run quarto render thesis/qmd/src/masters-thesis.qmd --to docx"
help = "Render the thesis to DOCX"
