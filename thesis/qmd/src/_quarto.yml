project:
  # One entry point for every artifact the thesis reads. Stages whose inputs
  # are absent are skipped rather than failed, so this same command works on a
  # machine with the MLflow store and the prepared data, and on CI, which has
  # neither and only needs the value macros rebuilt from the committed
  # snapshot. See src/masters_thesis/export/registry.py.
  pre-render: uv run thesis-export
