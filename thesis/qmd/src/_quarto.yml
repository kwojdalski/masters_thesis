project:
  pre-render:
    - uv run python ../../../scripts/export_all_to_thesis.py
    # Must follow the export above: it reads the artifacts that step refreshes
    # and turns the result values quoted in prose into LaTeX macros, so a
    # sentence and the table beside it cannot disagree after a re-run.
    - uv run python ../../../scripts/generate_thesis_value_macros.py
