description: Canonical thesis experiments using the complete pooled dataset.
output_root: logs
# TEMPORARILY DISABLED: a run's auto-export was overwriting thesis/qmd/results/
# snapshots with un-rescaled aggregates while 06-00-results.qmd's h1_algo_comparison
# cell was mid-review, producing two disagreeing "Return" figures for the same
# agent (13.87% in the frozen snapshot vs the cell's own 328.69% rescale). Flip
# back to `true` once the H1 table content is finalized and any re-run's export
# is expected to match it. Export manually in the meantime with:
#   uv run python scripts/export_eval_to_thesis.py --scenario <scenario>
export_to_thesis: false

hypotheses:
  h1:
    - pooled/td3_hft_lob_state_space_pooled_streaming_selected_dsr
    - pooled/ddpg_hft_lob_state_space_pooled_streaming_selected_dsr
    - pooled/ppo_hft_lob_state_space_pooled_streaming_selected_dsr
    - pooled/random_hft_lob_state_space_pooled_streaming_selected_dsr
  h2:  # transaction-cost sensitivity (0 bp arm is the H1 agent; fee is the only factor)
    - pooled/td3_hft_lob_state_space_pooled_streaming_selected_dsr
    - pooled/td3_h2_fees_1e6_dsr
    - pooled/td3_h2_fees_1e5_dsr
    - pooled/td3_h2_fees_1e4_dsr
  h3:  # feature specification
    - pooled/td3_h3_features_minimal
    - pooled/td3_hft_lob_state_space_pooled_streaming_selected
    - pooled/td3_h3_features_full
  h4:  # reward-function design
    - pooled/td3_hft_lob_state_space_pooled_streaming_selected
    - pooled/td3_hft_lob_state_space_pooled_streaming_selected_dsr

overrides: []
