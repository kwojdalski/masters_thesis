# H3 Sensitivity Analysis Configuration
#
# Maps each sensitivity axis to the ordered list of variants.
# Every variant points to a log_dir produced by `cli.py train --scenario <scenario>`.
# The baseline row within each axis is the one held constant across the other axes.
#
# Run order to reproduce:
#   Feature axis:
#     uv run python src/cli.py train --scenario pooled/td3_h3_features_minimal
#     uv run python src/cli.py train --scenario pooled/td3_hft_lob_state_space_pooled_streaming_selected   # baseline
#     uv run python src/cli.py train --scenario pooled/td3_h3_features_full
#   Reward axis:
#     (baseline already trained above)
#     uv run python src/cli.py train --scenario pooled/td3_hft_lob_state_space_pooled_streaming_selected_dsr
#   Transaction cost axis:
#     (baseline already trained above)
#     uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e6
#     uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e5
#     uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e4

axes:
  - name: feature_specification
    label: "Feature Specification"
    scenarios:
      - label: "Minimal (3 features)"
        log_dir: logs/td3_h3_features_minimal
        n_features: 3
        baseline: false
      - label: "Selected (10 features)"
        log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected
        n_features: 10
        baseline: true
      - label: "Full (33 features)"
        log_dir: logs/td3_h3_features_full
        n_features: 33
        baseline: false

  - name: reward_design
    label: "Reward Function Design"
    scenarios:
      - label: "Log Return"
        log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected
        baseline: true
      - label: "Differential Sharpe (DSR)"
        log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected_dsr
        baseline: false

  - name: transaction_costs
    label: "Transaction Costs"
    scenarios:
      - label: "0 bp"
        log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected
        fees: 0.0
        baseline: true
      - label: "0.01 bp"
        log_dir: logs/td3_h3_fees_1e6
        fees: 0.000001
        baseline: false
      - label: "0.1 bp"
        log_dir: logs/td3_h3_fees_1e5
        fees: 0.00001
        baseline: false
      - label: "1 bp"
        log_dir: logs/td3_h3_fees_1e4
        fees: 0.0001
        baseline: false
