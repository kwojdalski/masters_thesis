# H1 Performance vs Benchmarks Configuration
#
# H1: A TD3-based trading agent using order-book-derived high-frequency features
# can achieve stronger out-of-sample risk-adjusted performance than selected
# benchmark strategies under the assumptions of the simulated environment.
#
# List the trained agents to evaluate. Each must have a completed
# `cli.py evaluate` run that produced results.json in log_dir.
#
# Run training + evaluation with:
#   uv run thesis-experiments h1

agents:
  - label: "TD3"
    log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected_dsr
    algorithm: TD3
    primary: true
  - label: "DDPG"
    log_dir: logs/ddpg_hft_lob_state_space_pooled_streaming_selected_dsr
    algorithm: DDPG
    primary: false
  - label: "PPO"
    log_dir: logs/ppo_hft_lob_state_space_pooled_streaming_selected_dsr
    algorithm: PPO
    primary: false
  - label: "Random"
    log_dir: logs/random_hft_lob_state_space_pooled_streaming_selected_dsr
    algorithm: RANDOM
    primary: false

benchmarks:
  - name: buy_and_hold
    label: "Buy & Hold"
    label: "Short & Hold"
  - name: twap
    label: "TWAP"
  - name: vwap
    label: "VWAP"
  - name: random
    label: "Random"
