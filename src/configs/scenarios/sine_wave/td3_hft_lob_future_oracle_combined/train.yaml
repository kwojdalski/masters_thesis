seed: 42
data:
  data_path: ./data/raw/synthetic/sine_wave_hft_lob.parquet
  data_config: src/configs/data/sine_wave_hft_lob.yaml
  download_data: false
  train_size: 8000
  validation_size: 10000
  feature_config: "src/configs/feature_sets/hft_lob_oracle_with_market.yaml"
  filter_lob_levels: 5
  feature_cache_dir: .cache/feature_transformation
env:
  backend: tradingenv
  mode: hft
  feature_columns:
  - feature_future_close_vel
  - feature_hft_book_pressure_l0
  - feature_hft_order_book_imbalance_3l
  - feature_hft_order_count_imbalance_l0
  - feature_hft_microprice
  - feature_hft_microprice_divergence
  - feature_hft_bid_slope
  - feature_hft_ask_slope
  - feature_hft_ofi
  - feature_hft_ofi_rolling_50
  - feature_hft_signed_trade_flow_50
  - feature_position
  trading_fees: 0.0
  price_column: close
  include_position_feature: true
  streaming_episode_length: 7000
  obs_clip: 5.0
  reward_type: log_return
  reward_scale: 0.003
network:
  actor_hidden_dims:
  - 64
  - 32
  value_hidden_dims:
  - 64
  - 32
training:
  algorithm: TD3
  actor_lr: 0.0001
  value_lr: 0.0001
  value_weight_decay: 0.0
  actor_weight_decay: 0.0
  max_steps: 500000
  checkpoint_interval: 100000
  init_rand_steps: 3000
  frames_per_batch: 200
  optim_steps_per_batch: 5
  sample_size: 128
  buffer_size: 200000
  gamma: 0.9
  tau: 0.005
  loss_function: smooth_l1
  eval_interval: 1000
  temp_eval_interval: 100000
  log_interval: 100
  td3:
    policy_noise: 0.05
    noise_clip: 0.1
    policy_delay: 2
    delay_actor: true
    delay_qvalue: true
    exploration_noise_std: 0.8
evaluation:
  eval_steps: 10000

logging:
  log_level: INFO
  save_plots: false
explainability:
  enabled: false
  n_steps: 500
  methods:
  - permutation
  temp_explainability_interval: 100000
