seed: 99
data:
  data_path: ./data/raw/synthetic/sine_wave_ppo_no_trend.parquet
  data_config: src/configs/data/sine_wave_standard.yaml
  download_data: false
  train_size: 450
env:
  backend: tradingenv
  trading_fees: 0.0
  borrow_interest_rate: 0.0
  price_column: close
  reward_type: log_return
  reward_eta: 0.01
  execution_price: mid
  bid_column: bid_px_00
  ask_column: ask_px_00
  obs_latency_ticks: 0
  exec_latency_ticks: 0
  obs_latency_us: 0.0
  exec_latency_us: 0.0
network:
  actor_hidden_dims:
  - 64
  - 32
  value_hidden_dims:
  - 64
  - 32
training:
  algorithm: PPO
  actor_lr: 0.0003
  actor_weight_decay: 0
  value_lr: 0.0003
  value_weight_decay: 0.001
  max_steps: 30000
  init_rand_steps: 50
  frames_per_batch: 200
  optim_steps_per_batch: 40
  sample_size: 64
  buffer_size: 8000
  loss_function: l2
  eval_interval: 120
  log_interval: 40
  ppo:
    clip_epsilon: 0.2
    entropy_bonus: 0.15
    vf_coef: 0.5
    epochs: 4
evaluation:
  eval_steps: 440

logging:
  log_level: INFO
