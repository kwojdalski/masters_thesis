statistical_testing:
  enabled: true
  log_to_research_artifacts: true
  tests:
  - t_test
  - sharpe_bootstrap
  - sortino_bootstrap
  - mann_whitney
  confidence_level: 0.95
  n_bootstrap_samples: 10000
benchmarks:
  enabled:
  - buy_and_hold
  - twap
  - vwap
  - random_actions
  random_seed: 42
  n_random_trials: 10
