data:
  data_paths:
  - ./data/raw/stocks/daily/AAPL/AAPL_2026-02-25_raw_mbp-10_us_hours.parquet
  val_data_paths:
  - ./data/raw/stocks/daily/AAPL/AAPL_2026-03-02_raw_mbp-10_us_hours.parquet
  data_path: ./data/raw/stocks/daily/AAPL/AAPL_2026-02-25_raw_mbp-10_us_hours.parquet
  download_data: false
  train_size: 50000
  validation_size: 50000
  test_size: 50000
  lazy_load: true
  prepared_data_dir: ./data/prepared/aapl_single_day_small_obs
  memmap_dir: ./data/memmap/aapl_single_day_small_obs
  feature_cache_dir: .cache/feature_transformation
  filter_lob_levels: 5
  feature_config: src/configs/feature_sets/hft_lob_oracle_with_market.yaml
env:
  backend: tradingenv
  mode: hft
  trading_fees: 0.0
  price_column: close
  include_position_feature: true
  streaming_episode_length: 10000
  obs_clip: 5.0
  reward_type: differential_sharpe
  reward_eta: 0.01
  feature_columns:
  - feature_future_close_vel
  - feature_hft_book_pressure_l0
  - feature_hft_order_book_imbalance_3l
  - feature_hft_order_count_imbalance_l0
  - feature_hft_microprice
  - feature_hft_microprice_divergence
  - feature_hft_bid_slope
  - feature_hft_ask_slope
  - feature_hft_ofi
  - feature_hft_ofi_rolling_50
  - feature_hft_signed_trade_flow_50
  - feature_position
network:
  actor_hidden_dims:
  - 128
  - 64
  value_hidden_dims:
  - 128
  - 64
training:
  algorithm: TD3
  temp_eval_interval: 100000
  actor_lr: 0.0001
  value_lr: 0.0001
  value_weight_decay: 2.0e-06
  actor_weight_decay: 2.0e-06
  max_steps: 3000000
  checkpoint_interval: 100000
  init_rand_steps: 5000
  frames_per_batch: 200
  optim_steps_per_batch: 5
  sample_size: 128
  buffer_size: 100000
  save_buffer: true
  gamma: 0.995
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.3
  policy_delay: 2
  delay_actor: true
  delay_qvalue: true
  exploration_noise_std: 0.1
  loss_function: smooth_l1
  eval_fraction: 0.2
  eval_interval: 1000
  log_interval: 100
logging:
  log_level: INFO
  save_plots: false
explainability:
  enabled: false
  n_steps: 500
  methods:
  - permutation
  temp_explainability_interval: 100000
