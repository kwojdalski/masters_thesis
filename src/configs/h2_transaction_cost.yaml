# H2 Transaction-Cost Sensitivity Configuration
#
# H2: Empirical performance is materially sensitive to the transaction-cost
# assumption; the learned edge changes sign at a sub-basis-point proportional
# fee (the bid-ask half-spread scale).
#
# One sensitivity axis: the shared 0 bp baseline plus the fee ladder. Every
# variant points to a log_dir produced by `cli.py train --scenario <scenario>`.
# The scenario directories keep their legacy `_h3_` tokens (opaque IDs).
#
# Run order to reproduce:
#   uv run python src/cli.py train --scenario pooled/td3_hft_lob_state_space_pooled_streaming_selected  # baseline
#   uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e6
#   uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e5
#   uv run python src/cli.py train --scenario pooled/td3_h3_fees_1e4

axes:
  - name: transaction_costs
    label: "Transaction Costs"
    scenarios:
      - label: "0 bp"
        log_dir: logs/td3_hft_lob_state_space_pooled_streaming_selected
        fees: 0.0
        baseline: true
      - label: "0.01 bp"
        log_dir: logs/td3_h3_fees_1e6
        fees: 0.000001
        baseline: false
      - label: "0.1 bp"
        log_dir: logs/td3_h3_fees_1e5
        fees: 0.00001
        baseline: false
      - label: "1 bp"
        log_dir: logs/td3_h3_fees_1e4
        fees: 0.0001
        baseline: false
