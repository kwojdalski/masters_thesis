name: Publish Thesis to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "thesis/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # AUDIT_PLOTS: "1"   # temporarily off: suppresses the "commit .. | exported .." provenance note under tables and figures
      # THESIS_DEBUG_ASSETS: "1"   # temporarily off: suppresses the "Asset Provenance Audit Log" appendix section
      PYTHONPATH: ${{ github.workspace }}/thesis/qmd/src
      MPLBACKEND: Agg
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pre-push rebase below always has something to
          # rebase onto; fetch-depth: 2 broke when master advanced mid-render.
          fetch-depth: 0


      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Render defence presentation
        # The revealjs deck lives outside the thesis Quarto project. Its Python
        # cells draw directly from committed snapshots; no MLflow or raw data.
        # Deliberately placed before the thesis build -- a broken deck then
        # fails fast instead of after a multi-minute PDF render.
        run: uv run quarto render thesis/presentation/defence.qmd --to revealjs

      - name: Check the presentation is self-contained
        # embed-resources inlines reveal.js. Without it Quarto emits ~36 KB of
        # unstyled text that loads its library from a sidecar defence_files/
        # directory, so the deck opens as a plain document rather than slides.
        # That failure is invisible to `quarto render`, which exits 0 either
        # way, so assert it here: size floor plus an explicit sidecar check.
        run: |
          deck="thesis/presentation/defence.html"
          if [ ! -f "$deck" ]; then
            echo "::error::No presentation produced at $deck"
            exit 1
          fi
          bytes=$(wc -c < "$deck")
          echo "Presentation size: ${bytes} bytes"
          if [ "$bytes" -lt 500000 ]; then
            echo "::error::Presentation is only ${bytes} bytes; expected >= 500000. embed-resources did not apply, so reveal.js is not inlined."
            exit 1
          fi
          if grep -q 'defence_files/' "$deck"; then
            echo "::error::Presentation references the sidecar defence_files/ directory, so it is not self-contained."
            exit 1
          fi

      - name: Check slide structure and export presentation PDF
        # GitHub's Ubuntu image includes Google Chrome. The temporary Python
        # dependency keeps browser tooling out of the trading environment.
        run: uv run --with playwright==1.63.0 python thesis/presentation/export_pdf.py

      - name: Render thesis to HTML
        run: |
          uv run quarto render thesis/qmd/src/masters-thesis.qmd --to html
          mkdir -p _site
          cp thesis/qmd/src/masters-thesis.html _site/index.html
          cp -r thesis/qmd/src/masters-thesis_files _site/
          mkdir -p _site/diagrams
          cp thesis/qmd/src/diagrams/*.svg _site/diagrams/
      - name: Render thesis to PDF
        run: uv run quarto render thesis/qmd/src/masters-thesis.qmd --to pdf

      - name: Rebase on latest master
        # The render takes minutes; origin/master can advance in that window,
        # making the auto-commit push non-fast-forward. Rebase first so the
        # push is always fast-forward. Empty rebase is a no-op.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin master

      - name: Commit regenerated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: thesis/qmd/src/masters_thesis.pdf
          commit_message: "Chore: auto-render thesis PDF [skip ci]"

      - name: Copy PDF to site
        run: |
          echo "PDF file size: $(wc -c < thesis/qmd/src/masters_thesis.pdf) bytes"
          cp thesis/qmd/src/masters_thesis.pdf _site/masters_thesis.pdf

      - name: Copy presentation to site
        run: |
          cp thesis/presentation/defence.html _site/defence.html
          cp thesis/presentation/defence.pdf _site/defence.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
