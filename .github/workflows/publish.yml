name: Publish Thesis to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "thesis/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2


      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Render thesis to HTML
        run: |
          uv run quarto render thesis/qmd/src/masters-thesis.qmd --to html
          mkdir -p _site
          cp thesis/qmd/src/masters-thesis.html _site/index.html
          cp -r thesis/qmd/src/masters-thesis_files _site/
          mkdir -p _site/diagrams
          cp thesis/qmd/src/diagrams/*.svg _site/diagrams/
        env:
          PYTHONPATH: ${{ github.workspace }}/thesis/qmd/src
          MPLBACKEND: Agg

      - name: Render thesis to PDF
        run: uv run quarto render thesis/qmd/src/masters-thesis.qmd --to pdf
        env:
          PYTHONPATH: ${{ github.workspace }}/thesis/qmd/src
          MPLBACKEND: Agg

      - name: Commit regenerated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: thesis/qmd/src/masters_thesis.pdf
          commit_message: "Chore: auto-render thesis PDF [skip ci]"

      - name: Copy PDF to site
        run: |
          echo "PDF file size: $(wc -c < thesis/qmd/src/masters_thesis.pdf) bytes"
          cp thesis/qmd/src/masters_thesis.pdf _site/masters_thesis.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
